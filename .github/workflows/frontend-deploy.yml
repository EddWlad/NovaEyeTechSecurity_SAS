name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

# Lectura del repo y de los runs (el script que espera al backend consulta la API de Actions).
permissions:
  contents: read
  actions: read

# Dos despliegues del frontend nunca corren a la vez; el segundo espera al primero.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # La fuente de iconos se pide solo con los iconos usados: uno que falte se ve como texto.
      - name: Verificar iconos
        working-directory: frontend
        run: npm run check:icons

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # El runner de GitHub trae Chrome; sin pruebas en verde no se despliega.
      - name: Pruebas unitarias
        working-directory: frontend
        run: npm run test:ci

      - name: Build production
        working-directory: frontend
        run: npm run build -- --configuration production

      # Si este mismo commit cambia el backend, su despliegue va primero (ver el script).
      - name: Esperar al despliegue del backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-backend-deploy.sh

      - name: Deploy to Contabo
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: ${{ secrets.CONTABO_HOST }}
          USER: ${{ secrets.CONTABO_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'rm -rf /home/novaeyetech/novaeyetech/frontend-nuevo'

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r \
            frontend/dist/novaeyetech-frontend/browser \
            "$USER@$HOST:/home/novaeyetech/novaeyetech/frontend-nuevo"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'sudo /usr/local/bin/deploy-frontend.sh'

      - name: Verificar sitio responde
        run: |
          sleep 5
          curl -sf -o /dev/null "http://${{ secrets.CONTABO_HOST }}/"
