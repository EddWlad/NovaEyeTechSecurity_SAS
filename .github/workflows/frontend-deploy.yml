name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Deploy to Contabo
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: ${{ secrets.CONTABO_HOST }}
          USER: ${{ secrets.CONTABO_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'rm -rf /home/novaeyetech/novaeyetech/frontend-nuevo'

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r \
            frontend/dist/novaeyetech-frontend/browser \
            "$USER@$HOST:/home/novaeyetech/novaeyetech/frontend-nuevo"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'sudo /usr/local/bin/deploy-frontend.sh'

      - name: Verificar sitio responde
        run: |
          sleep 5
          curl -sf -o /dev/null "http://${{ secrets.CONTABO_HOST }}/"
