<div class="shell">
  <app-toast-stack />

  <aside class="sidebar" [ngClass]="{ open: sidebarOpen() }">
    <div class="brand">
      <!-- Solo el dibujo: el nombre va como texto debajo, que a este tamano se lee mejor que dentro de la imagen. -->
      <img alt="" src="logo-mark.png" width="278" height="231" />
      <p class="brand-name">NOVAEYE TECHNOLOGY S.A.S</p>
      <p class="brand-subtitle">Panel Administrativo</p>
    </div>

    <nav class="nav-list">
      <a
        *ngFor="let item of menuItems()"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <section class="profile-box" *ngIf="authService.user() as user">
      <div class="avatar">{{ userInitials() }}</div>
      <div>
        <strong>{{ user.fullName }}</strong>
        <p>{{ currentRoleLabel() }}</p>
      </div>
      <button class="btn btn-sm btn-secondary" type="button" title="Cerrar sesión" aria-label="Cerrar sesión" (click)="logout()">
        <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      </button>
    </section>
  </aside>

  <!-- Fondo del menu movil: atajo para mouse/tactil, oculto a lectores; con teclado se cierra con el boton del menu. -->
  <div class="overlay" aria-hidden="true" [ngClass]="{ show: sidebarOpen() }" (click)="toggleSidebar()"></div>

  <section class="content-area">
    <header class="topbar card">
      <button class="menu-toggle" type="button" aria-label="Abrir menú" [attr.aria-expanded]="sidebarOpen()" (click)="toggleSidebar()">
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>
      <app-breadcrumbs [items]="crumbs()" />
      <a class="btn btn-sm btn-secondary" routerLink="/profile">
        <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
        Mi Perfil
      </a>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </section>
</div>
